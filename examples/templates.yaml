  name: mysql-database
  title: MySQL Database
  description: Set up database configuration with migrations and backup policies.
  tags:
    - resource
spec:
  owner: group:default/platform-admins
  type: resource
  parameters:
    - title: Execution options
      properties:
        seconds:
          title: Duration in seconds
          type: integer
          minimum: 1
          maximum: 60
          default: 3
        outcome:
          title: Result
          type: string
          enum:
            - success
            - failure
          default: success
  steps:
    - id: run
      name: Initialize project
      action: platform:bootstrap
      input:
        seconds: ${{ parameters.seconds }}
        outcome: ${{ parameters.outcome }}
  output:
    text:
      - title: Project setup
        content: Your execution is available in the Template Pulse dashboard.
