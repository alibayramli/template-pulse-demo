<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#11243A" />
    <meta
      name="description"
      content="Track the health and adoption of your Backstage templates with execution analytics, performance insights, and searchable run history."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="<%= config.getOptionalString('app.title') ?? 'Template Pulse Demo' %>"
    />
    <meta
      property="og:description"
      content="Track the health and adoption of your Backstage templates with execution analytics, performance insights, and searchable run history."
    />
    <link
      rel="canonical"
      href="<%= config.getString('app.baseUrl').replace(/\/$/, '') %>/"
    />
    <meta
      property="og:url"
      content="<%= config.getString('app.baseUrl').replace(/\/$/, '') %>/"
    />
    <meta
      property="og:image"
      content="<%= config.getString('app.baseUrl').replace(/\/$/, '') %>/template-pulse-preview.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1440" />
    <meta property="og:image:height" content="754" />
    <meta
      property="og:image:alt"
      content="Template Pulse dashboard showing template health, success rates, and run times."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="<%= config.getString('app.baseUrl').replace(/\/$/, '') %>/template-pulse-preview.png"
    />
    <meta
      name="twitter:image:alt"
      content="Template Pulse dashboard showing template health, success rates, and run times."
    />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link
      rel="manifest"
      href="<%= publicPath %>/manifest.json"
      crossorigin="use-credentials"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="<%= publicPath %>/favicon.svg"
    />
    <link rel="icon" href="<%= publicPath %>/favicon.ico" sizes="any" />
    <link rel="shortcut icon" href="<%= publicPath %>/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="<%= publicPath %>/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="<%= publicPath %>/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="<%= publicPath %>/favicon-16x16.png"
    />
    <link
      rel="mask-icon"
      href="<%= publicPath %>/safari-pinned-tab.svg"
      color="#11243A"
    />
    <title>
      <%= config.getOptionalString('app.title') ?? 'Template Pulse Demo' %>
    </title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `yarn start`.
      To create a production bundle, use `yarn build`.
    -->
  </body>
</html>
