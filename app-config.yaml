app:
  title: Template Pulse
  baseUrl: http://localhost:3000
  packages: all
  extensions:
    - entity-card:org/group-profile
    - entity-card:org/members-list
    - entity-card:org/ownership
    - entity-card:org/user-profile
  routes:
    bindings:
      template-pulse.task: scaffolder.ongoingTask
organization:
  name: Template Pulse
backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
    host: 127.0.0.1
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: better-sqlite3
    connection:
      directory: ../../.data
auth:
  environment: development
  providers:
    guest:
      userEntityRef: user:default/admin
      ownershipEntityRefs: [user:default/admin, group:default/platform-admins]
permission:
  enabled: true
templatePulse:
  historySource: database
  maxTasks: 250
  maxHistoryRows: 10000
catalog:
  rules:
    - allow: [Component, System, API, Resource, Location]
  locations:
    - type: file
      target: ../../examples/component.yaml
    - type: file
      target: ../../examples/templates.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../examples/groups.yaml
      rules:
        - allow: [Group]
    - type: file
      target: ../../examples/users.yaml
      rules:
        - allow: [User]
